# trawl sources. Edit freely; the daily run reads this file.

window_days: 3            # look back this many days (two days of buffer)
max_age_days: 60          # skip papers published longer ago than this (late-indexed)
max_candidates: 900       # hard cap on abstracts screened per run (cost guard)
keep_days: 14             # days of results shown in README

models:
  screen: claude-haiku-5-5     # stage 1: grade every abstract
  write: claude-sonnet-5-5     # stage 2: write takeaway + reason for Core/High

# --- bioRxiv / medRxiv ------------------------------------------------------
# bioRxiv: every new preprint in these categories is screened (no keyword filter).
# Preprints in any other category are screened only if they hit the keyword sets below.
biorxiv_categories:
  - microbiology
  - genomics
  - bioinformatics
  - evolutionary biology
  - ecology
  - systems biology
  - molecular biology
  - genetics
  - synthetic biology
  - immunology
# medRxiv is noisy: only preprints whose title/abstract hit the keyword sets below.
medrxiv: keywords_only

# --- PubMed -----------------------------------------------------------------
