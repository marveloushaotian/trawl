name: daily

on:
  schedule:
    # Helsinki noon is 10:00 UTC in winter and 09:00 UTC in summer.
    # Both fire; the script runs once per day, only after 12:00 Helsinki.
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
    - cron: "37 11 * * *"   # safety net if the earlier runs were skipped or delayed
  workflow_dispatch:
    inputs:
      window_days:
        description: "Look-back window in days (blank = config default)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "data/social.md"
      - "data/events.md"

permissions:
  contents: write

concurrency:
  group: trawl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Literature run
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python src/run.py --scheduled
          elif [ -n "${{ github.event.inputs.window_days }}" ]; then
            python src/run.py --window-days "${{ github.event.inputs.window_days }}"
          else
            python src/run.py
          fi

      - name: Re-render after social/events update
        if: github.event_name == 'push'
        run: python src/run.py --render-only

      - name: Commit
        run: |
          git config user.name  "${{ vars.GIT_AUTHOR_NAME }}"
          git config user.email "${{ vars.GIT_AUTHOR_EMAIL }}"
          git add README.md data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trawl: $(TZ=Europe/Helsinki date +%F)"
          git pull --rebase --quiet
          git push
