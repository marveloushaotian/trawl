name: daily

on:
  schedule:
    # GitHub may delay or drop scheduled runs, so fire hourly from 09:23 to 15:23 UTC.
    # The script itself runs once per day, only after 12:00 Helsinki (summer or winter time);
    # the other triggers exit in seconds.
    - cron: "23 9-15 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Look-back window in days (blank = config default)"
        required: false
        default: ""
      reset_today:
        description: "Forget today's results and screen again (testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trawl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Cheap gate for the hourly cron: before 12:00 Helsinki, or already done today -> stop here.
      - name: Due today?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Europe/Helsinki date +%F); hour=$(TZ=Europe/Helsinki date +%-H)
          if [ "$hour" -lt 12 ] || grep -q "\"date\": \"$today\"" data/runs.json 2>/dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not due (hour $hour, today $today)."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Literature run
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python src/run.py --scheduled
          else
            ARGS=""
            [ -n "${{ github.event.inputs.window_days }}" ] && ARGS="$ARGS --window-days ${{ github.event.inputs.window_days }}"
            [ "${{ github.event.inputs.reset_today }}" = "true" ] && ARGS="$ARGS --reset-today"
            python src/run.py $ARGS
          fi

      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "Haotian Zheng"
          git config user.email "49090241+marveloushaotian@users.noreply.github.com"
          git add README.md data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trawl: $(TZ=Europe/Helsinki date +%F)"
          git pull --rebase --quiet
          git push
