name: daily

on:
  schedule:
    # GitHub delays scheduled runs on this account by roughly 8-10 hours, and the delay
    # varies, so a fixed noon cron never lands at noon. Firing every hour instead means
    # that whatever the delay is, some trigger surfaces soon after the gate opens.
    # The gate below still runs the screening once a day, only after 12:00 Helsinki;
    # every other trigger exits in seconds.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Look-back window in days (blank = config default)"
        required: false
        default: ""
      reset_today:
        description: "Forget today's results and screen again (testing)"
        type: boolean
        default: false
      as_schedule:
        description: "Behave like a scheduled run (used by the backup trigger in the profile repo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # its own group: the daily list must not wait behind a long backfill. Commits can no
  # longer collide (each run writes its own per-month files and re-renders after rebasing).
  group: trawl-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }

      # Cheap gate for the hourly cron: before 12:00 Helsinki, or already done today -> stop here.
      - name: Due today?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.as_schedule }}" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Once per Helsinki day, at whatever hour a trigger happens to arrive, but never
          # within 6 hours of the previous run: otherwise a late-evening run and one just
          # after midnight would split a single day of papers across two near-empty lists.
          today=$(TZ=Europe/Helsinki date +%F)
          if grep -q "\"date\": \"$today\"" data/runs.json 2>/dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Already ran on $today."; exit 0
          fi
          gap=$(python3 -c "import json,datetime as t; d=t.datetime.fromisoformat(json.load(open('data/runs.json'))[-1]['at'].replace('Z','+00:00')); print(int((t.datetime.now(t.timezone.utc)-d).total_seconds()//3600))" 2>/dev/null || echo 999)
          if [ "$gap" -lt 6 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Last run was ${gap}h ago; too soon."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Literature run
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.as_schedule }}" = "true" ]; then
            python src/run.py --scheduled
          else
            ARGS=""
            [ -n "${{ github.event.inputs.window_days }}" ] && ARGS="$ARGS --window-days ${{ github.event.inputs.window_days }}"
            [ "${{ github.event.inputs.reset_today }}" = "true" ] && ARGS="$ARGS --reset-today"
            python src/run.py $ARGS
          fi

      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "Haotian Zheng"
          git config user.email "49090241+marveloushaotian@users.noreply.github.com"
          git add README.md data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "trawl: $(TZ=Europe/Helsinki date +%F)"
          git checkout -- .
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q origin/main; then
              python src/archive.py --rebuild
              git add archive/ README.md
              git diff --cached --quiet || git commit -q --amend --no-edit
              git push -q && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 15))
          done
          exit 1

