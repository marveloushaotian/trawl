name: backfill

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Calendar month to screen (YYYY-MM)"
        required: true
      replace:
        description: "Screen the whole month again, ignoring what is already covered"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trawl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen the month
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python src/backfill.py --month "${{ github.event.inputs.month }}" $([ "${{ github.event.inputs.replace }}" = "true" ] && echo --replace)
      - name: Commit
        run: |
          git config user.name  "Haotian Zheng"
          git config user.email "49090241+marveloushaotian@users.noreply.github.com"
          git add archive/ data/archive/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trawl archive: ${{ github.event.inputs.month }}"
          git pull --rebase --quiet
          git push
