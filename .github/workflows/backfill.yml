name: backfill

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month (2026-09), a list (2026-08,2026-09) or a range (2025-11..2026-08)"
        required: true
      replace:
        description: "Screen these months again, ignoring what is already covered"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.expand.outputs.months }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - id: expand
        run: echo "months=$(python3 src/months.py '${{ github.event.inputs.month }}')" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1          # one month at a time, so each starts from the previous month's commit
      fail-fast: false
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      # ref: main, not the dispatch SHA, so every month sees the months already committed
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen ${{ matrix.month }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python src/backfill.py --month "${{ matrix.month }}" $([ "${{ github.event.inputs.replace }}" = "true" ] && echo --replace)
      - name: Commit
        run: |
          git config user.name  "Haotian Zheng"
          git config user.email "49090241+marveloushaotian@users.noreply.github.com"
          # Commit only the per-month sources of truth: no other job writes these files,
          # so the rebase below can never conflict. Rendered files are regenerated after it.
          git add data/archive/months/ data/archive/screened/
          if git diff --cached --quiet; then echo "nothing screened"; exit 0; fi
          git commit -q -m "trawl archive: ${{ matrix.month }}"
          git checkout -- .          # drop the rendered files; regenerated after the rebase
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q origin/main; then
              python src/archive.py --rebuild
              git add archive/
              git diff --cached --quiet || git commit -q --amend --no-edit
              git push -q && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 15))
          done
          echo "could not push ${{ matrix.month }}"
          exit 1
