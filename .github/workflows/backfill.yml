name: backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First publication date to screen (YYYY-MM-DD)"
        required: true
      end:
        description: "Last publication date to screen (YYYY-MM-DD)"
        required: true
      replace:
        description: "Re-screen this period if it was already archived"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trawl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen the period
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python src/backfill.py --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}" $([ "${{ github.event.inputs.replace }}" = "true" ] && echo --replace)
      - name: Commit
        run: |
          git config user.name  "Haotian Zheng"
          git config user.email "49090241+marveloushaotian@users.noreply.github.com"
          git add archive/ data/archive/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trawl archive: ${{ github.event.inputs.start }} to ${{ github.event.inputs.end }}"
          git pull --rebase --quiet
          git push
